                      textAlign: 'right',
                      justifyContent: 'flex-start',
                      boxShadow: hoveredIndex === i ? '0 20px 40px rgba(0, 0, 0, 0.05)' : '0 20px 40px rgba(0, 0, 0, 0.02)',
                      border: '1px solid rgba(0, 0, 0, 0.05)',
                      position: 'relative',
                      overflow: 'hidden',
                      transform: hoveredIndex === i ? 'translateY(-6px)' : 'none',
                      transition: 'transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s, border-color 0.3s'
                    }}>
                      {/* Highlight border line overlay with card's primary color with opacity */}
                      <div style={{
                        position: 'absolute',
                        inset: 0,
                        borderRadius: '32px',
                        border: `1px solid ${s.hoverBorder}`,
                        opacity: hoveredIndex === i ? 1 : 0,
                        transition: 'opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
                        pointerEvents: 'none',
                        zIndex: 3
                      }} />
                      <div className="srv-icon-wrap" style={{
                        width: '64px',
                        height: '64px',
                        borderRadius: '50%',
                        background: '#ffffff',
                        border: s.iconBorder,
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        marginBottom: '28px'
                      }}>
                        <img src={s.icon} alt="" style={{ width: '32px', height: '32px', objectFit: 'contain' }} />
                      </div>
                      <div className="srv-title" style={{ fontSize: '20px', fontWeight: '800', marginBottom: '12px', color: '#0a0a0f', letterSpacing: '-0.02em' }}>{s.title}</div>
                      <div className="srv-desc" style={{ fontSize: '14.5px', lineHeight: '1.6', color: '#374151', marginBottom: '32px', flexGrow: 1 }}>{s.desc}</div>
                      <button
                        className="btn-ghost"
                        style={{
                          width: '100%',
                          justifyContent: 'center',
                          marginTop: 'auto',
                          zIndex: 4
                        }}
                        onClick={() => setSelectedService(s)}
                      >
                        {s.btnText}
                      </button>
                    </div>
                  </div>
                </R>
              ))}
            </div>
          </div>

          {selectedService && (
            <div className="popup-overlay" onClick={() => { setSelectedService(null); setIsPopDropdownOpen(false); }}>
              <div className="popup-content" style={{
                background: '#ffffff',
                border: '1px solid rgba(0, 0, 0, 0.08)',
                borderRadius: '24px',
                padding: '36px',
                width: '100%',
                maxWidth: '480px',
                boxShadow: '0 24px 60px rgba(0,0,0,0.08)',
                position: 'relative',
                transform: 'translateY(20px)',
                animation: 'slideUp 0.3s forwards',
                color: '#0a0a0f',
                textAlign: 'right'
              }} onClick={e => e.stopPropagation()}>
                {showSuccess ? (
                  <div style={{ textAlign: 'center', padding: '40px 0', animation: 'fadeIn 0.3s' }}>
                    <div style={{ width: '64px', height: '64px', borderRadius: '50%', background: '#22c55e20', color: '#22c55e', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 24px' }}>
                      <svg width="32" height="32" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" /></svg>
                    </div>
                    <h3 style={{ fontSize: '24px', fontWeight: 800, marginBottom: '8px', color: '#0a0a0f' }}>تم إرسال الطلب بنجاح!</h3>
                    <p style={{ color: '#6b7280' }}>جاري فتح تطبيق البريد الإلكتروني الخاص بك...</p>
                  </div>
                ) : (
                  <form onSubmit={handleSend} style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                    <h3 style={{ fontSize: '22px', fontWeight: 800, letterSpacing: '-0.02em', color: '#0a0a0f' }}>ابدأ مشروعاً جديداً</h3>

                    <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
                      <label style={{ fontSize: '11px', fontWeight: '400', textTransform: 'uppercase', letterSpacing: '0.05em', color: '#6b7280' }}>اختر الخدمة</label>
                      <div style={{ position: 'relative' }}>
                        <div
                          className="dark-input"
                          style={{ cursor: 'pointer', display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: '#ffffff', border: '1px solid #e5e7eb' }}
                          onClick={() => setIsPopDropdownOpen(!isPopDropdownOpen)}
                        >
                          <span style={{ color: selectedService ? '#0a0a0f' : '#9ca3af', fontWeight: selectedService ? '600' : '400' }}>
                            {selectedService ? selectedService.title : 'اختر خدمة...'}
                          </span>
                          <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24" style={{ transform: isPopDropdownOpen ? 'rotate(180deg)' : 'none', transition: 'transform 0.2s', color: '#6b7280' }}>
                            <polyline points="6 9 12 15 18 9" />
                          </svg>
                        </div>

                        {isPopDropdownOpen && (
                          <div style={{
                            position: 'absolute', top: '100%', left: 0, right: 0, marginTop: '8px',
                            background: 'white', border: '1px solid #e5e7eb', borderRadius: '12px',
                            boxShadow: '0 10px 30px rgba(0,0,0,0.08)', zIndex: 10, padding: '8px 0',
                            animation: 'fadeIn 0.2s ease'
                          }}>
                            {items.map(o => (
                              <div
                                key={o.title}
                                style={{ padding: '12px 16px', cursor: 'pointer', fontSize: '14px', color: '#0a0a0f', transition: 'background 0.2s', fontWeight: '600' }}
                                onMouseEnter={e => e.target.style.background = '#f4f6fb'}
                                onMouseLeave={e => e.target.style.background = 'transparent'}
                                onClick={() => { setSelectedService(o); setIsPopDropdownOpen(false); }}
                              >
                                {o.title}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    </div>

                    <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
                      <label style={{ fontSize: '11px', fontWeight: '400', textTransform: 'uppercase', letterSpacing: '0.05em', color: '#6b7280' }}>البريد الإلكتروني</label>
                      <input
                        className="dark-input"
                        style={{ border: '1px solid #e5e7eb', background: '#ffffff', borderRadius: '10px', height: '42px', padding: '0 12px', fontSize: '14px', color: '#0a0a0f', textAlign: 'right' }}
                        type="email"
                        required
                        placeholder="email@example.com"
                        value={formData.email}
                        onChange={e => setFormData({ ...formData, email: e.target.value })}
                      />
                    </div>

                    <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
                      <label style={{ fontSize: '11px', fontWeight: '400', textTransform: 'uppercase', letterSpacing: '0.05em', color: '#6b7280' }}>وصف قصير للمشروع</label>
                      <textarea
                        className="dark-input"
                        style={{ border: '1px solid #e5e7eb', background: '#ffffff', borderRadius: '10px', minHeight: '100px', padding: '12px', fontSize: '14px', resize: 'vertical', color: '#0a0a0f', textAlign: 'right' }}
                        required
                        placeholder="أخبرني بلمحة عن مشروعك..."
                        value={formData.desc}
                        onChange={e => setFormData({ ...formData, desc: e.target.value })}
                      />
                    </div>

                    <div style={{ display: 'flex', gap: '12px', marginTop: '8px' }}>
                      <button type="submit" className="btn-primary" style={{ flex: 1, justifyContent: 'center' }}>لنبدأ المشروع</button>
                      <button type="button" className="btn-ghost" style={{ padding: '0 24px' }} onClick={() => { setSelectedService(null); setIsPopDropdownOpen(false); }}>إلغاء</button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          )}
        </section>
      );
    };

    /* ─── CONTACT ─── */
    const Contact = () => {
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [desc, setDesc] = useState('');
      const [service, setService] = useState('');
      const [customService, setCustomService] = useState('');
      const [isDropdownOpen, setIsDropdownOpen] = useState(false);
      const [showSuccess, setShowSuccess] = useState(false);

      const serviceOptions = [
        { value: 'youtube', label: 'صناعة هوية اليوتيوب' },
        { value: 'carousels', label: 'منشورات شرائح لينكد إن وإكس' },
        { value: 'identity', label: 'حقائب الهوية الشخصية المتكاملة' },
        { value: 'another', label: 'خدمة أخرى' }
      ];

      const selectedOption = serviceOptions.find(o => o.value === service);

      const handleSubmit = (e) => {
        e.preventDefault();
        const selectedServiceLabel = service === 'another' ? customService : (selectedOption ? selectedOption.label : '');
        const subject = encodeURIComponent(`New Project Inquiry from ${name}`);
        const body = encodeURIComponent(`Name: ${name}\nEmail: ${email}\nService: ${selectedServiceLabel}\n\nDescription:\n${desc}`);
        window.location.href = `mailto:Kacper@creatorsflow.org?subject=${subject}&body=${body}`;

        setShowSuccess(true);
        setTimeout(() => {
          setShowSuccess(false);
          setName('');
          setEmail('');
          setService('');
          setCustomService('');
          setDesc('');
        }, 3000);
      };

      return (
        <section id="contact" style={{ position: 'relative', overflow: 'hidden', padding: '60px 24px' }}>
          <div className="contact-grid-bg"></div>
          <div className="contact-wrap projects-inner" style={{ position: 'relative', zIndex: 1, padding: 0 }}>
            <R>
              <div style={{ display: 'flex', justifyContent: 'center', marginBottom: '20px' }}>
                <span style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', border: '1px solid rgba(0, 0, 0, 0.12)', borderRadius: '100px', padding: '6px 16px', fontSize: '13px', fontWeight: '500', color: '#0a0a0f', background: 'transparent' }}>
                  اتصل بنا
                </span>
              </div>
            </R>
            <R d={50}>
              <h2 className="section-h2" style={{ fontSize: 'clamp(24px, 3vw, 36px)', fontWeight: '700', marginTop: '0', marginBottom: '12px', color: '#0a0a0f', letterSpacing: '-0.02em', textAlign: 'center' }}>لنصنع شيئاً استثنائياً معاً</h2>
            </R>
            <R d={75}>
              <p style={{ fontSize: '14px', color: '#4b5563', marginBottom: '48px', fontWeight: '500', letterSpacing: '-0.01em', textAlign: 'center' }}>هل ترغب في العمل معنا أو لديك أي استفسار؟ سأرد عليك خلال ٢٤ ساعة</p>
            </R>

            <div>
              <div
                className="contact-form-card"
                style={{
                  position: 'relative',
                  background: 'linear-gradient(to bottom, rgba(244, 63, 94, 0.06) 0%, #ffffff 100%)',
                  border: '1px solid rgba(0, 0, 0, 0.05)',
                  borderRadius: '32px',
                  padding: '40px 32px',
                  boxShadow: '0 20px 40px rgba(0, 0, 0, 0.02)',
                  color: '#0a0a0f',
                  maxWidth: '1104px',
                  margin: '0 auto',
                  width: '100%',
                  textAlign: 'right'
                }}
              >
                {showSuccess ? (
                  <div style={{ textAlign: 'center', padding: '40px 0', animation: 'fadeIn 0.3s' }}>
                    <div style={{ width: '64px', height: '64px', borderRadius: '50%', background: '#22c55e20', color: '#22c55e', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 24px' }}>
                      <svg width="32" height="32" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" /></svg>
                    </div>
                    <h3 style={{ fontSize: '24px', fontWeight: 800, marginBottom: '8px', color: '#0a0a0f' }}>تم إرسال طلبك بنجاح!</h3>
                    <p style={{ color: '#6b7280' }}>جاري فتح تطبيق البريد الإلكتروني الخاص بك...</p>
                  </div>
                ) : (
                  <form onSubmit={handleSubmit} className="dark-form" style={{ background: 'transparent', padding: 0, border: 'none', boxShadow: 'none' }}>
                    <div className="dark-frow">
                      <div>
                        <label className="dark-label" style={{ fontSize: '14px', fontWeight: '400', textTransform: 'none', color: '#374151', marginBottom: '8px', display: 'block', letterSpacing: 'normal' }}>الاسم الكريم</label>
                        <input className="dark-input" type="text" required placeholder="اسمك هنا" value={name} onChange={e => setName(e.target.value)} style={{ border: '1px solid #e5e7eb', background: '#ffffff', borderRadius: '10px', height: '42px', padding: '0 12px', fontSize: '14px', color: '#0a0a0f', width: '100%', textAlign: 'right' }} />
                      </div>
                      <div>
                        <label className="dark-label" style={{ fontSize: '14px', fontWeight: '400', textTransform: 'none', color: '#374151', marginBottom: '8px', display: 'block', letterSpacing: 'normal' }}>البريد الإلكتروني</label>
                        <input className="dark-input" type="email" required placeholder="example@company.com" value={email} onChange={e => setEmail(e.target.value)} style={{ border: '1px solid #e5e7eb', background: '#ffffff', borderRadius: '10px', height: '42px', padding: '0 12px', fontSize: '14px', color: '#0a0a0f', width: '100%', textAlign: 'right' }} />
                      </div>
                    </div>

                    <div style={{ marginBottom: '16px' }}>
                      <label className="dark-label" style={{ fontSize: '14px', fontWeight: '400', textTransform: 'none', color: '#374151', marginBottom: '8px', display: 'block', letterSpacing: 'normal' }}>اختر الخدمة المطلوبة</label>
                      <div style={{ position: 'relative' }}>
                        <div
                          className="dark-input"
                          style={{ cursor: 'pointer', display: 'flex', justifyContent: 'space-between', alignItems: 'center', border: '1px solid #e5e7eb', background: '#ffffff', borderRadius: '10px', height: '42px', padding: '0 12px', fontSize: '14px', color: '#0a0a0f' }}
                          onClick={() => setIsDropdownOpen(!isDropdownOpen)}
                        >
                          <span style={{ color: selectedOption ? '#0a0a0f' : '#9ca3af', fontWeight: selectedOption ? '600' : '400' }}>
                            {selectedOption ? selectedOption.label : 'اختر خدمة...'}
                          </span>
                          <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24" style={{ transform: isDropdownOpen ? 'rotate(180deg)' : 'none', transition: 'transform 0.2s', color: '#6b7280' }}>
                            <polyline points="6 9 12 15 18 9" />
                          </svg>
                        </div>

                        {isDropdownOpen && (
                          <div style={{
                            position: 'absolute', top: '100%', left: 0, right: 0, marginTop: '8px',
                            background: 'white', border: '1px solid #e5e7eb', borderRadius: '12px',
                            boxShadow: '0 10px 30px rgba(0,0,0,0.08)', zIndex: 10, padding: '8px 0',
                            animation: 'fadeIn 0.2s ease', textAlign: 'right'
                          }}>
                            {serviceOptions.map(o => (
                              <div
                                key={o.value}
                                style={{ padding: '12px 16px', cursor: 'pointer', fontSize: '14px', color: '#0a0a0f', transition: 'background 0.2s', fontWeight: '600' }}
                                onMouseEnter={e => e.target.style.background = '#f4f6fb'}
                                onMouseLeave={e => e.target.style.background = 'transparent'}
                                onClick={() => { setService(o.value); setIsDropdownOpen(false); }}
                              >
                                {o.label}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    </div>

                    {service === 'another' && (
                      <div style={{ marginBottom: '16px', animation: 'fadeIn 0.3s ease' }}>
                        <label className="dark-label" style={{ fontSize: '14px', fontWeight: '400', textTransform: 'none', color: '#374151', marginBottom: '8px', display: 'block', letterSpacing: 'normal' }}>حدد الخدمة الأخرى</label>
                        <input className="dark-input" type="text" placeholder="يرجى التحديد..." value={customService} onChange={e => setCustomService(e.target.value)} style={{ border: '1px solid #e5e7eb', background: '#ffffff', borderRadius: '10px', height: '42px', padding: '0 12px', fontSize: '14px', color: '#0a0a0f', width: '100%', textAlign: 'right' }} />
                      </div>
                    )}

                    <div style={{ marginBottom: '24px' }}>
                      <label className="dark-label" style={{ fontSize: '14px', fontWeight: '400', textTransform: 'none', color: '#374151', marginBottom: '8px', display: 'block', letterSpacing: 'normal' }}>ما الذي تعمل عليه حالياً؟</label>
                      <textarea className="dark-input" rows="5" required placeholder="صف مشروعك أو فكرتك بالتفصيل..." value={desc} onChange={e => setDesc(e.target.value)} style={{ border: '1px solid #e5e7eb', background: '#ffffff', borderRadius: '10px', padding: '12px', fontSize: '14px', color: '#0a0a0f', width: '100%', resize: 'none', textAlign: 'right' }} />
                    </div>

                    <button type="submit" className="btn-primary" style={{ width: '100%', justifyContent: 'center', height: '46px', fontSize: '14px' }}>إرسال الرسالة</button>
                  </form>
                )}
              </div>
            </div>
          </div>
        </section>
      );
    };

    /* ─── FOOTER ─── */
    const Footer = () => (
      <footer style={{
        background: 'transparent',
        padding: '60px 24px 40px',
        borderTop: '1px solid rgba(0, 0, 0, 0.05)',
        textAlign: 'center',
        position: 'relative',
        overflow: 'hidden'
      }}>
        {/* Dot grid points background */}
        <div className="footer-grid-bg" style={{
          position: 'absolute',
          inset: 0,
          backgroundImage: 'radial-gradient(rgba(10, 10, 15, 0.12) 1.5px, transparent 1.5px)',
          backgroundSize: '32px 32px',
          opacity: 0.8,
          zIndex: 0,
          pointerEvents: 'none'
        }} />

        {/* 2 CTA Buttons from Hero section */}
        <div className="footer-cta" style={{ display: 'flex', justifyContent: 'center', gap: '12px', marginBottom: '40px', position: 'relative', zIndex: 1 }}>
          <a href="#contact" className="btn-primary" style={{ textDecoration: 'none' }}>تحدث معي</a>
          <a href="#video" className="btn-ghost" style={{ textDecoration: 'none', display: 'inline-flex', alignItems: 'center', gap: '8px' }}>
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
            شاهد الفيديو
          </a>
        </div>

        {/* Footer Navigation Links */}
        <div className="footer-links" style={{ display: 'flex', justifyContent: 'center', gap: '24px', marginBottom: '32px', position: 'relative', zIndex: 1, flexWrap: 'wrap' }}>
          <a href="#home" style={{ color: '#4b5563', fontSize: '16px', fontWeight: '600', textDecoration: 'none', transition: 'color 0.2s' }} onMouseEnter={e => e.target.style.color = '#f43f5e'} onMouseLeave={e => e.target.style.color = '#4b5563'}>الرئيسية</a>
          <a href="#about" style={{ color: '#4b5563', fontSize: '16px', fontWeight: '600', textDecoration: 'none', transition: 'color 0.2s' }} onMouseEnter={e => e.target.style.color = '#f43f5e'} onMouseLeave={e => e.target.style.color = '#4b5563'}>من أنا</a>
          <a href="#projects" style={{ color: '#4b5563', fontSize: '16px', fontWeight: '600', textDecoration: 'none', transition: 'color 0.2s' }} onMouseEnter={e => e.target.style.color = '#f43f5e'} onMouseLeave={e => e.target.style.color = '#4b5563'}>آلية العمل</a>
          <a href="#services" style={{ color: '#4b5563', fontSize: '16px', fontWeight: '600', textDecoration: 'none', transition: 'color 0.2s' }} onMouseEnter={e => e.target.style.color = '#f43f5e'} onMouseLeave={e => e.target.style.color = '#4b5563'}>الخدمات</a>
          <a href="#contact" style={{ color: '#4b5563', fontSize: '16px', fontWeight: '600', textDecoration: 'none', transition: 'color 0.2s' }} onMouseEnter={e => e.target.style.color = '#f43f5e'} onMouseLeave={e => e.target.style.color = '#4b5563'}>اتصل بنا</a>
          <a href="#booking" style={{ color: '#4b5563', fontSize: '16px', fontWeight: '600', textDecoration: 'none', transition: 'color 0.2s' }} onMouseEnter={e => e.target.style.color = '#f43f5e'} onMouseLeave={e => e.target.style.color = '#4b5563'}>الحجز</a>
        </div>

        {/* MARIESTA Large Outline text design positioned at the bottom of the footer */}
        <div style={{
          position: 'relative',
          marginBottom: '24px',
          zIndex: 1,
          fontFamily: 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
          fontWeight: '900',
          fontSize: 'clamp(60px, 12vw, 150px)',
          color: 'transparent',
          WebkitTextStroke: '1.5px rgba(10, 10, 15, 0.18)',
          letterSpacing: '0.15em',
          textTransform: 'uppercase',
          whiteSpace: 'nowrap',
          userSelect: 'none',
          lineHeight: '1'
        }}>
          MARIESTA
        </div>

        {/* Reserved rights sentence on bottom of footer */}
        <p style={{ fontSize: '13px', color: '#6b7280', margin: '0', position: 'relative', zIndex: 1, fontWeight: '500' }}>
          © ٢٠٢٦ ماريستا. جميع الحقوق محفوظة.
        </p>
      </footer>
    );

    /* ─── BOTTOM NAV ─── */
    const BottomNav = () => {
      const [active, setActive] = useState('home');

      const navItems = [
        { id: 'home', label: 'الرئيسية', icon: Svg.home },
        { id: 'about', label: 'من أنا', icon: Svg.user },
        { id: 'projects', label: 'آلية العمل', icon: Svg.briefcase },
        { id: 'contact', label: 'اتصل بنا', icon: Svg.mail }
      ];

      useEffect(() => {
        const handleScroll = () => {
          const scrollPos = window.scrollY + window.innerHeight * 0.5;
          let currentId = 'home';
          const ids = ['home', 'about', 'projects', 'contact'];
          for (let i = ids.length - 1; i >= 0; i--) {
            const section = document.getElementById(ids[i]);
            if (section && section.offsetTop <= scrollPos) {
              currentId = ids[i];
              break;
            }
          }
          setActive(currentId);
        };
        window.addEventListener('scroll', handleScroll);
        handleScroll();
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      return (
        <div className="bottom-nav">
          <div className="bottom-nav-inner">
            {navItems.map(item => (
              <a
                key={item.id}
                href={`#${item.id}`}
                className={`b-nav-item ${active === item.id ? 'active' : ''}`}
                onClick={() => setActive(item.id)}
              >
                <div className="b-nav-icon">{item.icon}</div>
                <span>{item.label}</span>
              </a>
            ))}
          </div>
        </div>
      );
    };

    /* ─── FLOATING FIGMA LOGOS ─── */
    const FloatingLogos = () => {
      const [logos, setLogos] = useState([
        { id: 1, left: '15vw', delay: '0s', duration: '3.5s', sway: '35vw', endSway: '70vw', rotate: '25deg', size: '250px' },
        { id: 2, left: '85vw', delay: '0.1s', duration: '3.8s', sway: '-35vw', endSway: '-70vw', rotate: '-30deg', size: '220px' }
      ]);

      const removeLogo = (id) => {
        setLogos(prev => prev.filter(logo => logo.id !== id));
      };

      return (
        <div style={{ position: 'fixed', inset: 0, pointerEvents: 'none', zIndex: 9999, overflow: 'hidden' }}>
          {logos.map(logo => (
            <img
              key={logo.id}
              src="file2/3dicons-figma-dynamic-color.png"
              alt="Floating Figma Logo"
              onAnimationEnd={() => removeLogo(logo.id)}
              style={{
                position: 'absolute',
                top: '100vh',
                left: logo.left,
                width: logo.size,
                height: 'auto',
                animation: `floatUp ${logo.duration} linear ${logo.delay} forwards`,
                '--sway-distance': logo.sway,
                '--end-sway': logo.endSway,
                '--rotation': logo.rotate
              }}
            />
          ))}
        </div>
      );
    };

    /* ─── SCROLL TO TOP ─── */
    const ScrollToTop = () => {
      const [visible, setVisible] = useState(false);

      useEffect(() => {
        const toggleVisibility = () => {
          if (window.scrollY > 400) {
            setVisible(true);
          } else {
            setVisible(false);
          }
        };
        window.addEventListener('scroll', toggleVisibility);
        return () => window.removeEventListener('scroll', toggleVisibility);
      }, []);

      const scrollToTop = () => {
        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
      };

      return (
        <button
          onClick={scrollToTop}
          className={`scroll-to-top ${visible ? 'visible' : ''}`}
          aria-label="Back to top"
        >
          <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
            <polyline points="18 15 12 9 6 15" />
          </svg>
        </button>
      );
    };

    /* ─── CALENDAR WIDGET ─── */
    const Calendar = ({ onSelectSlot }) => {
      const today = new Date();
      const [currentMonth, setCurrentMonth] = useState(today.getMonth());
      const [currentYear, setCurrentYear] = useState(today.getFullYear());
      const [selectedDate, setSelectedDate] = useState(null);
      const [selectedSlot, setSelectedSlot] = useState(null);

      const months = [
        'يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو',
        'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'
      ];

      const daysOfWeek = ['أحد', 'إثن', 'ثلا', 'أرب', 'خمس', 'جمع', 'سبت'];

      const getDaysInMonth = (month, year) => {
        return new Date(year, month + 1, 0).getDate();
      };

      const getFirstDayIndex = (month, year) => {
        return new Date(year, month, 1).getDay();
      };

      const daysInMonth = getDaysInMonth(currentMonth, currentYear);
      const firstDayIndex = getFirstDayIndex(currentMonth, currentYear);

      const handlePrevMonth = () => {
        if (currentMonth === 0) {
          setCurrentMonth(11);
          setCurrentYear(currentYear - 1);
        } else {
          setCurrentMonth(currentMonth - 1);
        }
        setSelectedDate(null);
        setSelectedSlot(null);
      };

      const handleNextMonth = () => {
        if (currentMonth === 11) {
          setCurrentMonth(0);
          setCurrentYear(currentYear + 1);
        } else {
          setCurrentMonth(currentMonth + 1);
        }
        setSelectedDate(null);
        setSelectedSlot(null);
      };

      const handleDayClick = (day) => {
        const clicked = new Date(currentYear, currentMonth, day);
        if (clicked < new Date(today.getFullYear(), today.getMonth(), today.getDate())) return;

        setSelectedDate(day);
        setSelectedSlot(null);
      };

      const timeSlots = [
        '07:00 م - 07:15 م',
        '07:15 م - 07:30 م',
        '07:30 م - 07:45 م',
        '07:45 م - 08:00 م'
      ];

      const cells = [];
      for (let i = 0; i < firstDayIndex; i++) {
        cells.push(<div key={`empty-${i}`} className="calendar-day-cell disabled" style={{ background: 'transparent', cursor: 'default' }} />);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const currentCellDate = new Date(currentYear, currentMonth, day);
        const isPast = currentCellDate < new Date(today.getFullYear(), today.getMonth(), today.getDate());
        const isSelected = selectedDate === day;
        const isToday = today.getDate() === day && today.getMonth() === currentMonth && today.getFullYear() === currentYear;

        cells.push(
          <div
            key={`day-${day}`}
            className={`calendar-day-cell ${isPast ? 'disabled' : ''} ${isSelected ? 'selected' : ''} ${isToday ? 'today' : ''}`}
            onClick={() => handleDayClick(day)}
            style={{
              aspectRatio: '1',
              display: 'flex',
              alignItems: 'center',
              justifycontent: 'center',
              borderRadius: '50%',
              fontSize: '14px',
              fontWeight: '600',
              cursor: isPast ? 'not-allowed' : 'pointer',
              color: isSelected ? '#ffffff' : (isPast ? '#d1d5db' : '#1f2937'),
              background: isSelected ? '#f43f5e' : 'transparent',
              border: isToday ? '1.5px solid #f43f5e' : 'none',
              boxShadow: isSelected ? '0 4px 12px rgba(244, 63, 94, 0.3)' : 'none',
              transition: 'background 0.2s, color 0.2s',
              display: 'inline-flex',
              alignItems: 'center',
              justifyContent: 'center',
              width: '100%',
              height: '100%'
            }}
          >
            {day}
          </div>
        );
      }

      return (
        <div className="calendar-container" style={{ background: 'transparent', border: 'none', padding: 0, boxShadow: 'none', display: 'flex', flexDirection: 'column', gap: '20px', width: '100%' }}>
          <div className="calendar-header-ui" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', color: '#0a0a0f', fontSize: '18px', fontWeight: '700' }}>
            <span>{months[currentMonth]} {currentYear}</span>
            <div style={{ display: 'flex', gap: '8px' }}>
              <button
                className="calendar-btn-nav"
                onClick={handlePrevMonth}
                style={{ background: '#ffffff', border: '1px solid #e5e7eb', borderRadius: '8px', width: '32px', height: '32px', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', color: '#4b5563', transition: 'all 0.2s' }}
                onMouseEnter={e => { e.currentTarget.style.borderColor = '#f43f5e'; e.currentTarget.style.color = '#f43f5e'; }}
                onMouseLeave={e => { e.currentTarget.style.borderColor = '#e5e7eb'; e.currentTarget.style.color = '#4b5563'; }}
              >
                &lt;
              </button>
              <button
                className="calendar-btn-nav"
                onClick={handleNextMonth}
                style={{ background: '#ffffff', border: '1px solid #e5e7eb', borderRadius: '8px', width: '32px', height: '32px', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', color: '#4b5563', transition: 'all 0.2s' }}
                onMouseEnter={e => { e.currentTarget.style.borderColor = '#f43f5e'; e.currentTarget.style.color = '#f43f5e'; }}
                onMouseLeave={e => { e.currentTarget.style.borderColor = '#e5e7eb'; e.currentTarget.style.color = '#4b5563'; }}
              >
                &gt;
              </button>
            </div>
          </div>

          <div className="calendar-grid-days" style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '6px', textAlign: 'center' }}>
            {daysOfWeek.map(d => (
              <div key={d} className="calendar-day-header" style={{ fontSize: '12px', fontWeight: '700', color: '#9ca3af', textTransform: 'uppercase', paddingBottom: '6px' }}>{d}</div>
            ))}
            {cells}
          </div>

          {selectedDate && (
            <div className="slots-container" style={{ borderTop: '1px solid rgba(0, 0, 0, 0.06)', paddingTop: '20px', animation: 'fadeIn 0.3s' }}>
              <div className="slots-title" style={{ fontSize: '13px', fontWeight: '700', color: '#374151', marginBottom: '12px', textTransform: 'uppercase', letterSpacing: '0.02em', textAlign: 'right' }}>
                المواعيد المتاحة ليوم {selectedDate} {months[currentMonth]}
              </div>
              <div className="slots-grid" style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(140px, 1fr))', gap: '10px' }}>
                {timeSlots.map(slot => (
                  <div
                    key={slot}
                    className={`slot-item ${selectedSlot === slot ? 'selected' : ''}`}
                    onClick={() => {
                      setSelectedSlot(slot);
                      onSelectSlot({
                        date: new Date(currentYear, currentMonth, selectedDate),
                        time: slot
                      });
                    }}
                    style={{
                      padding: '10px 14px',
                      borderRadius: '10px',
                      border: selectedSlot === slot ? '1.5px solid #f43f5e' : '1.5px solid #e5e7eb',
                      background: selectedSlot === slot ? '#f43f5e' : '#ffffff',
                      color: selectedSlot === slot ? '#ffffff' : '#374151',
                      fontSize: '13.5px',
                      fontWeight: '600',
                      textAlign: 'center',
                      cursor: 'pointer',
                      transition: 'all 0.2s'
                    }}
                    onMouseEnter={e => {
                      if (selectedSlot !== slot) {
                        e.currentTarget.style.borderColor = '#f43f5e';
                        e.currentTarget.style.color = '#f43f5e';
                        e.currentTarget.style.background = 'rgba(244, 63, 94, 0.03)';
                      }
                    }}
                    onMouseLeave={e => {
                      if (selectedSlot !== slot) {
                        e.currentTarget.style.borderColor = '#e5e7eb';
                        e.currentTarget.style.color = '#374151';
                        e.currentTarget.style.background = '#ffffff';
                      }
                    }}
                  >
                    {slot.split(' - ')[0]}
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    };

    /* ─── MEETING ─── */
    const Meeting = () => {
      const useCalCom = true; // Toggle to true to connect and display Cal.com embed instead of local calendar!
      const calContainerRef = useRef(null);

      const [bookingDetails, setBookingDetails] = useState(null);
      const [formActive, setFormActive] = useState(false);
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [desc, setDesc] = useState('');
      const [success, setSuccess] = useState(false);
      const [loading, setLoading] = useState(false);

      const handleSelectSlot = (slot) => {
        setBookingDetails(slot);
        setFormActive(true);
      };

      const handleConfirmBooking = (e) => {
        e.preventDefault();
        if (!name || !email) return;
        setLoading(true);

        const formattedDate = bookingDetails.date.toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        const mailBody = `مرحباً كاسبر،\n\nأود تأكيد موعد اجتماعنا في يوم ${formattedDate} خلال الفترة ${bookingDetails.time}.\n\nبياناتي الشخصية:\nالاسم: ${name}\nالبريد الإلكتروني: ${email}\nوصف المشروع: ${desc}\n\nأتطلع للحديث معك قريباً!`;
        const mailtoUrl = `mailto:Kacper@creatorsflow.org?subject=Meeting Confirmation: ${formattedDate}&body=${encodeURIComponent(mailBody)}`;

        setTimeout(() => {
          setLoading(false);
          setSuccess(true);
          // Open default mail client silently without refreshing current window context
          const link = document.createElement('a');
          link.href = mailtoUrl;
          link.click();
        }, 1200);
      };

      useEffect(() => {
        if (useCalCom) {
          // Official Cal.com inline embed loader initialization
          (function (C, A, L) {
            let p = function (a, ar) { a.q.push(ar); };
            let d = C.document;
            C.Cal = C.Cal || function () {
              let cal = C.Cal;
              let ar = arguments;
              if (!cal.loaded) {
                cal.ns = {};
                cal.q = cal.q || [];
                d.head.appendChild(d.createElement("script")).src = A;
                cal.loaded = true;
              }
              if (ar[0] === L) {
                const api = function () { p(api, arguments); };
                const namespace = ar[1];
                api.q = api.q || [];
                if (typeof namespace === "string") {
                  cal.ns[namespace] = cal.ns[namespace] || api;
                  p(cal.ns[namespace], ar);
                  p(cal, ["initNamespace", namespace]);
                } else p(cal, ar);
                return;
              }
              p(cal, ar);
            };
          })(window, "https://app.cal.com/embed/embed.js", "init");

          window.Cal("init", "15min", { origin: "https://app.cal.com" });
          window.Cal.config = window.Cal.config || {};
          window.Cal.config.forwardQueryParams = true;

          window.Cal.ns["15min"]("inline", {
            elementOrSelector: "#my-cal-inline-15min",
            config: { "layout": "month_view", "useSlotsViewOnSmallScreen": "true", "theme": "light" },
            calLink: "emailcontact-3b9mhk/15min",
          });

          window.Cal.ns["15min"]("ui", { "theme": "light", "cssVarsPerTheme": { "light": { "cal-brand": "#000000" } }, "hideEventTypeDetails": true, "layout": "month_view" });
        }
      }, [useCalCom]);

      const formattedDateStr = bookingDetails?.date.toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

      return (
        <section id="booking" style={{ position: 'relative', overflow: 'hidden', padding: '80px 24px' }}>
          {/* Dot grid points background */}
          <div className="booking-grid-bg" style={{
            position: 'absolute',
            inset: 0,
            backgroundImage: 'radial-gradient(rgba(10, 10, 15, 0.12) 1.5px, transparent 1.5px)',
            backgroundSize: '32px 32px',
            opacity: 0.8,
            zIndex: 0,
            pointerEvents: 'none'
          }} />

          <div className="schedule-wrap projects-inner" style={{ position: 'relative', zIndex: 1, padding: 0 }}>
            {/* Centered Capsule Header */}
            <R>
              <div style={{ display: 'flex', justifyContent: 'center', marginBottom: '20px' }}>
                <span style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', border: '1px solid rgba(0, 0, 0, 0.12)', borderRadius: '100px', padding: '6px 16px', fontSize: '13px', fontWeight: '500', color: '#0a0a0f', background: 'transparent' }}>
                  الحجز
                </span>
              </div>
            </R>
            <R d={50}>
              <h2 className="section-h2" style={{ fontSize: 'clamp(24px, 3vw, 36px)', fontWeight: '700', marginTop: '0', marginBottom: '12px', color: '#0a0a0f', letterSpacing: '-0.02em', textAlign: 'center' }}>احجز جلسة استشارية</h2>
            </R>
            <R d={75}>
              <p style={{ fontSize: '14px', color: '#4b5563', marginBottom: '48px', fontWeight: '500', letterSpacing: '-0.01em', textAlign: 'center' }}>احجز جلسة استشارية مجانية مباشرة في تقويمي أدناه.</p>
            </R>

            {useCalCom ? (
              /* Cal.com Inline Embed Container sitting directly on section background */
              <div id="my-cal-inline-15min" style={{ width: '100%', minHeight: '650px', overflow: 'scroll', background: 'transparent', marginTop: '-24px' }} />
            ) : (
              /* Beautiful Local Calendar Fallback inside card */
              <div
                className="contact-form-card"
                style={{
                  position: 'relative',
                  background: 'linear-gradient(to bottom, rgba(244, 63, 94, 0.06) 0%, #ffffff 100%)',
                  border: '1px solid rgba(0, 0, 0, 0.05)',
                  borderRadius: '32px',
                  padding: 'clamp(20px, 4vw, 40px)',
                  boxShadow: '0 20px 40px rgba(0, 0, 0, 0.02)',
                  color: '#0a0a0f',
                  maxWidth: '650px',
                  margin: '0 auto',
                  width: '100%'
                }}
              >
                <Calendar onSelectSlot={handleSelectSlot} />
              </div>
            )}
          </div>

          {formActive && !useCalCom && (
            <div className="booking-modal-overlay" onClick={() => setFormActive(false)}>
              <div className="popup-content" onClick={e => e.stopPropagation()} style={{ background: 'linear-gradient(to bottom, rgba(244, 63, 94, 0.06) 0%, #ffffff 100%)', border: '1px solid rgba(0, 0, 0, 0.08)', borderRadius: '24px', padding: '36px', maxWidth: '480px', width: '100%', boxShadow: '0 20px 60px rgba(0,0,0,0.15)', textAlign: 'right' }}>
                {loading ? (
                  /* Rotating Loader state card */
                  <div style={{ textAlign: 'center', padding: '32px 0', animation: 'fadeIn 0.3s' }}>
                    <div className="spinner" style={{
                      width: '48px',
                      height: '48px',
                      border: '4px solid rgba(244, 63, 94, 0.1)',
                      borderTop: '4px solid #f43f5e',
                      borderRadius: '50%',
                      margin: '0 auto 24px',
                      animation: 'spin 1s linear infinite'
                    }} />
                    <h3 style={{ fontSize: '20px', fontWeight: 800, marginBottom: '8px', color: '#0a0a0f', letterSpacing: '-0.02em' }}>جاري معالجة الحجز...</h3>
                    <p style={{ color: '#6b7280', fontSize: '14px' }}>جاري تأمين موعد جلستك الاستشارية...</p>
                  </div>
                ) : success ? (
                  /* Successful booking confirmation card with details */
                  <div style={{ textAlign: 'center', padding: '24px 0', animation: 'fadeIn 0.3s' }}>
                    <div style={{ width: '64px', height: '64px', borderRadius: '50%', background: '#22c55e20', color: '#22c55e', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 20px' }}>
                      <svg width="32" height="32" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" /></svg>
                    </div>
                    <h3 style={{ fontSize: '22px', fontWeight: 800, marginBottom: '8px', color: '#0a0a0f', letterSpacing: '-0.02em' }}>تم تأكيد الحجز بنجاح!</h3>
                    <p style={{ color: '#6b7280', fontSize: '14px', marginBottom: '24px' }}>تم التحقق من تفاصيل جلستك الاستشارية:</p>

                    {/* Booking details card simplified */}
                    <div style={{ background: '#f9fafb', border: '1px solid #e5e7eb', borderRadius: '16px', padding: '20px', textAlign: 'right', marginBottom: '28px' }}>
                      <div style={{ fontSize: '13px', color: '#6b7280', marginBottom: '4px' }}>اليوم</div>
                      <div style={{ fontSize: '15px', fontWeight: '700', color: '#0a0a0f', marginBottom: '12px' }}>{formattedDateStr}</div>

                      <div style={{ fontSize: '13px', color: '#6b7280', marginBottom: '4px' }}>الوقت</div>
                      <div style={{ fontSize: '15px', fontWeight: '700', color: '#0a0a0f', marginBottom: '12px' }}>{bookingDetails?.time}</div>

                      <div style={{ fontSize: '13px', color: '#6b7280', marginBottom: '4px' }}>البريد الإلكتروني</div>
                      <div style={{ fontSize: '15px', fontWeight: '700', color: '#0a0a0f' }}>{email}</div>
                    </div>

                    <button
                      type="button"
                      className="btn-primary"
                      onClick={() => {
                        setFormActive(false);
                        setSuccess(false);
                        setName('');
                        setEmail('');
                        setDesc('');
                      }}
                      style={{ width: '100%', justifyContent: 'center' }}
                    >
                      تم
                    </button>
                  </div>
                ) : (
                  <form onSubmit={handleConfirmBooking}>
                    <h3 style={{ fontSize: '22px', fontWeight: 800, marginBottom: '8px', color: '#0a0a0f', letterSpacing: '-0.02em' }}>أكد حجز جلستك</h3>
                    <p style={{ fontSize: '13.5px', color: '#6b7280', marginBottom: '24px' }}>
                      الموعد المختار: <strong>{formattedDateStr}</strong> في تمام الساعة <strong>{bookingDetails?.time}</strong>
                    </p>

                    <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                      <div>
                        <label className="dark-label" style={{ marginBottom: '6px' }}>الاسم الكريم</label>
                        <input className="dark-input" type="text" required placeholder="اسمك هنا" value={name} onChange={e => setName(e.target.value)} style={{ border: '1px solid #e5e7eb', textAlign: 'right' }} />
                      </div>

                      <div>
                        <label className="dark-label" style={{ marginBottom: '6px' }}>البريد الإلكتروني</label>
                        <input className="dark-input" type="email" required placeholder="example@example.com" value={email} onChange={e => setEmail(e.target.value)} style={{ border: '1px solid #e5e7eb', textAlign: 'right' }} />
                      </div>

                      <div>
                        <label className="dark-label" style={{ marginBottom: '6px' }}>تفاصيل المشروع</label>
                        <textarea className="dark-input" rows="3" placeholder="أخبرني بلمحة عن مشروعك..." value={desc} onChange={e => setDesc(e.target.value)} style={{ border: '1px solid #e5e7eb', resize: 'none', textAlign: 'right' }} />
                      </div>

                      <div style={{ display: 'flex', gap: '12px', marginTop: '8px' }}>
                        <button type="submit" className="btn-primary" style={{ flex: 1, justifyContent: 'center' }}>تأكيد الحجز</button>
                        <button type="button" className="btn-ghost" onClick={() => setFormActive(false)} style={{ padding: '0 24px' }}>إلغاء</button>
                      </div>
                    </div>
                  </form>
                )}
              </div>
            </div>
          )}
        </section>
      );
    };

    /* ─── APP ─── */
    const App = () => {
      const [showPromo, setShowPromo] = useState(false);
      const [flowers, setFlowers] = useState([]);

      // Function to trigger the flower explosion (throwing many flowers on the screen)
      const triggerFlowerExplosion = () => {
        const flowerImages = ['images/1.png', 'images/5.png'];
        const newFlowers = [];
        const count = 40; // Number of flowers to throw

        for (let i = 0; i < count; i++) {
          const id = Math.random().toString(36).substr(2, 9);
          // Distribute flowers across the screen width
          const startX = Math.random() * 100; // in vw
          const endX = startX + (Math.random() * 40 - 20); // drift left or right
          const delay = Math.random() * 1.5; // staggered start times
          const duration = 2.5 + Math.random() * 2; // fall duration
          const size = 30 + Math.random() * 50; // px
          const rotate = Math.random() * 360 + 360; // rotation amount
          const imageSrc = flowerImages[Math.floor(Math.random() * flowerImages.length)];
          const scale = 0.5 + Math.random() * 0.8;

          newFlowers.push({
            id,
            startX: `${startX}vw`,
            endX: `${endX}vw`,
            delay: `${delay}s`,
            duration: `${duration}s`,
            size: `${size}px`,
            rot: `${rotate}deg`,
            s: scale,
            src: imageSrc
          });
        }
        setFlowers(newFlowers);
      };

      // Trigger the explosion on load
      useEffect(() => {
        // triggerFlowerExplosion();
      }, []);

      const handleApplyDiscount = () => {
        setShowPromo(false);
        // Apply discount logic here (e.g. alert or toast notification)
        alert('تم تطبيق كود الخصم 10% بنجاح! استمتع بالتسوق.');
        triggerFlowerExplosion(); // throw more flowers on successful action!
      };

      const handleClosePromo = () => {
        setShowPromo(false);
        triggerFlowerExplosion();
      };

      return (
        <div>
          {/* Flower Particle Overlay Container */}
          <div style={{ position: 'fixed', inset: 0, pointerEvents: 'none', zIndex: 9999, overflow: 'hidden' }}>
            {flowers.map(f => (
              <img
                key={f.id}
                src={f.src}
                alt="flower"
                className="flower-particle"
                style={{
                  width: f.size,
                  height: 'auto',
                  left: f.startX,
                  animationDelay: f.delay,
                  animationDuration: f.duration,
                  '--start-x': f.startX,
                  '--end-x': f.endX,
                  '--rot': f.rot,
                  '--s': f.s
                }}
                onAnimationEnd={() => {
                  setFlowers(prev => prev.filter(item => item.id !== f.id));
                }}
              />
            ))}
          </div>

          {/* Promo Popup Modal */}
          {showPromo && (
            <div className="promo-overlay" style={{ direction: 'rtl' }}>
              <div className="promo-modal" style={{ border: '1px solid rgba(244, 63, 94, 0.25)', background: 'rgba(255, 255, 255, 0.95)' }}>
                <button className="promo-close" onClick={handleClosePromo} aria-label="Close">✕</button>
                <div style={{ width: '80px', height: '80px', margin: '0 auto 20px', background: '#ffe4e6', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  <img src="images/1.png" alt="Flowers icon" style={{ width: '48px', height: '48px', objectFit: 'contain' }} />
                </div>
                <h2 style={{ fontSize: '24px', fontWeight: '800', color: '#0a0a0f', marginBottom: '12px' }}>أهلاً بك في متجر الورد الخاص بنا!</h2>
                <p style={{ fontSize: '15px', color: '#4b5563', marginBottom: '24px', lineHeight: '1.6' }}>
                  احصل على خصم <strong>10%</strong> عند الشراء من الموقع اليوم. عبّر عن مشاعرك بأجمل بوكيهات الورد.
                </p>
                <div style={{ display: 'flex', gap: '12px', justifyContent: 'center' }}>
                  <button onClick={handleApplyDiscount} className="btn-primary" style={{ background: '#e11d48', borderColor: '#e11d48', color: '#fff', fontSize: '14px', height: '46px', flex: 1, justifyContent: 'center' }}>
                    تطبيق الخصم
                  </button>
                  <button onClick={handleClosePromo} className="btn-ghost" style={{ fontSize: '14px', height: '46px', flex: 1, justifyContent: 'center' }}>
                    تصفح الموقع
                  </button>
                </div>
              </div>
            </div>
          )}

          <ScrollToTop />
          <Navbar />
          <Hero />
          <Marquee />
          <About />
          <Projects />
          <Services />
          <Contact />
          <Meeting />
          <Footer />
          <BottomNav />
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script>
    // Lightweight prefetch script for instant navigation
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll('a').forEach(link => {
        if (link.hostname === window.location.hostname && link.pathname !== window.location.pathname) {
          link.addEventListener('mouseenter', () => {
            const conn = navigator.connection;
            if (conn && (conn.saveData || /2g|slow-2g/.test(conn.effectiveType))) return;
            const href = link.getAttribute('href');
            if (!href || href.startsWith('#')) return;
            let prefetchLink = document.querySelector(`link[href="${href}"]`);
            if (!prefetchLink) {
              prefetchLink = document.createElement('link');
              prefetchLink.rel = 'prefetch';
              prefetchLink.href = href;
              document.head.appendChild(prefetchLink);
            }
          }, { once: true });
        }
      });
    });
  </script>
</body>
