<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم — كاسبر</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase SDKs & Custom Configurations -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { ink: '#0a0a0f', offwhite: '#f5f4f0', accent: '#e11d48', accentL: '#fb7185', dim: '#6b7280', card: '#ffffff', border: '#e5e7eb' },
          fontFamily: {
            sans: ['"Thmanyah Sans"', 'Inter', 'sans-serif'],
            serif: ['"Thmanyah Serif Text"', '"Thmanyah Serif Display"', 'Georgia', 'serif']
          }
        }
      }
    }
  </script>
  <style>
    @font-face {
      font-family: 'Thmanyah Sans';
      src: url('woff2/thmanyahsans-Regular.woff2') format('woff2');
      font-weight: 400;
    }
    @font-face {
      font-family: 'Thmanyah Sans';
      src: url('woff2/thmanyahsans-Bold.woff2') format('woff2');
      font-weight: 700;
    }
    body {
      font-family: 'Thmanyah Sans', 'Inter', sans-serif;
      background: #fcfcfc;
      color: #0f172a;
    }
  </style>
</head>

<body class="bg-slate-50/50 min-h-screen">
  <div id="admin-root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const categories = [
      { id: 0, title: "بوكيه زفاف" },
      { id: 1, title: "بوكيه تخرج" },
      { id: 2, title: "بوكيه احتفال" },
      { id: 3, title: "بوكيه مولود" },
      { id: 4, title: "بوكيه فلوس" },
      { id: 5, title: "ورد ستان" },
      { id: 6, title: "فراشات" },
      { id: 7, title: "توبرز" },
      { id: 8, title: "كروت معايدة" },
      { id: 9, title: "هواية" },
      { id: 10, title: "صواني خطوبة" },
      { id: 11, title: "بصمات كتب كتاب" }
    ];

    const AdminApp = () => {
      const [isLoggedIn, setIsLoggedIn] = useState(() => {
        return sessionStorage.getItem("admin_logged") === "true";
      });
      const [username, setUsername] = useState("");
      const [password, setPassword] = useState("");
      const [loginError, setLoginError] = useState("");
      const [dbStatus, setDbStatus] = useState("local");

      // Products State
      const [products, setProducts] = useState([]);
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedCategoryFilter, setSelectedCategoryFilter] = useState("all");

      // Toast Notifications
      const [toast, setToast] = useState({ show: false, message: "", type: "success" });

      const showToast = (message, type = "success") => {
        setToast({ show: true, message, type });
        setTimeout(() => setToast({ show: false, message: "", type: "success" }), 3500);
      };



      // Manage Form Modal / Drawer State
      const [isFormOpen, setIsFormOpen] = useState(false);
      const [editingProduct, setEditingProduct] = useState(null);

      // Form inputs
      const [formName, setFormName] = useState("");
      const [formPrice, setFormPrice] = useState("");
      const [formImage, setFormImage] = useState("images/22.png");
      const [formImages, setFormImages] = useState([]);
      const [formCategory, setFormCategory] = useState(0);
      const [formDescription, setFormDescription] = useState("");
      const [formAvailable, setFormAvailable] = useState(true);

      // Compress large Base64 images to fit Firestore's 1MB limit
      const compressImage = (base64Str, maxWidth = 400, maxHeight = 400) => {
        return new Promise((resolve) => {
          const img = new Image();
          img.src = base64Str;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.7)); // 70% quality JPEG
          };
        });
      };

      // Quick Image Presets for easier entry
      const imagePresets = [
        "images/22.png",
        "images/بطاقة 3.png",
        "images/بطاقة6.png",
        "images/بطاقة2.png",
        "images/بطاقة5.png",
        "images/بطاقة4.png",
        "images/1.png",
        "images/5.png",
        "images/بطاقة 1.png"
      ];

      useEffect(() => {
        // Set Firebase / Local indicator status
        setDbStatus(window.AppDB.isFirebase() ? "firebase" : "local");

        // Subscribe to products
        const unsubscribe = window.AppDB.getProducts((data) => {
          setProducts(data);
        });
        return () => unsubscribe();
      }, []);

      const handleLogin = (e) => {
        e.preventDefault();
        if (username === fallbackAdminCredentials.username && password === fallbackAdminCredentials.password) {
          sessionStorage.setItem("admin_logged", "true");
          setIsLoggedIn(true);
          setLoginError("");
          showToast("تم تسجيل الدخول بنجاح", "success");
        } else {
          setLoginError("اسم المستخدم أو كلمة المرور غير صحيحة");
        }
      };

      const handleLogout = () => {
        sessionStorage.removeItem("admin_logged");
        setIsLoggedIn(false);
        showToast("تم تسجيل الخروج", "info");
      };

      const openAddForm = () => {
        setEditingProduct(null);
        setFormName("");
        setFormPrice("");
        setFormImage("images/22.png");
        setFormImages([]);
        setFormCategory(0);
        setFormDescription("");
        setFormAvailable(true);
        setIsFormOpen(true);
      };

      const openEditForm = (prod) => {
        setEditingProduct(prod);
        setFormName(prod.name || "");
        setFormPrice(prod.price || "");
        setFormImage(prod.image || "images/22.png");
        setFormImages(prod.images ? prod.images.filter(img => img !== prod.image) : []);
        setFormCategory(prod.category !== undefined ? parseInt(prod.category) : 0);
        setFormDescription(prod.description || "");
        setFormAvailable(prod.available !== false);
        setIsFormOpen(true);
      };

      const handleSaveProduct = async (e) => {
        e.preventDefault();
        const productPayload = {
          name: formName,
          price: formPrice,
          image: formImage,
          images: [formImage, ...formImages].filter(Boolean),
          category: parseInt(formCategory),
          description: formDescription,
          available: formAvailable
        };

        try {
          if (editingProduct) {
            await window.AppDB.updateProduct(editingProduct.id, productPayload);
            showToast("تم تعديل المنتج بنجاح!", "success");
          } else {
            await window.AppDB.addProduct(productPayload);
            showToast("تم إضافة المنتج بنجاح!", "success");
          }
          setIsFormOpen(false);
        } catch (err) {
          console.error("Error saving product: ", err);
          showToast("حدث خطأ أثناء حفظ المنتج.", "error");
        }
      };

      const handleDeleteProduct = async (prod) => {
        if (confirm(`هل أنت متأكد من حذف المنتج "${prod.name}"؟`)) {
          try {
            await window.AppDB.deleteProduct(prod.id, prod);
            showToast("تم حذف المنتج بنجاح!", "success");
          } catch (err) {
            console.error("Error deleting product: ", err);
            showToast("حدث خطأ أثناء حذف المنتج.", "error");
          }
        }
      };



      // Filter products list
      const filteredProducts = useMemo(() => {
        return products.filter((prod) => {
          const matchSearch = prod.name?.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              prod.description?.toLowerCase().includes(searchQuery.toLowerCase());
          const matchCat = selectedCategoryFilter === "all" || parseInt(prod.category) === parseInt(selectedCategoryFilter);
          return matchSearch && matchCat;
        });
      }, [products, searchQuery, selectedCategoryFilter]);

      if (!isLoggedIn) {
        return (
          <div class="flex min-h-screen items-center justify-center bg-slate-950 px-6 py-12">
            <div class="w-full max-w-md space-y-8 bg-white p-8 rounded-3xl shadow-2xl border border-slate-100">
              <div class="text-center">
                <img src="images/شعار.png" alt="Logo" class="mx-auto h-12 w-auto mb-4" />
                <h2 class="text-2xl font-black text-slate-900">تسجيل الدخول للوحة التحكم</h2>
                <p class="mt-2 text-sm text-slate-500">الرجاء إدخال بيانات الاعتماد لإدارة منتجات المعرض</p>
              </div>

              <form class="mt-8 space-y-6" onSubmit={handleLogin}>
                {loginError && (
                  <div class="bg-rose-50 text-accent px-4 py-3 rounded-xl text-sm font-semibold border border-rose-100 text-center">
                    {loginError}
                  </div>
                )}
                <div class="space-y-4">
                  <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">اسم المستخدم</label>
                    <input
                      type="text"
                      required
                      value={username}
                      onChange={(e) => setUsername(e.target.value)}
                      class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent focus:border-accent outline-none text-slate-800 text-right"
                      placeholder="admin"
                    />
                  </div>
                  <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">كلمة المرور</label>
                    <input
                      type="password"
                      required
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent focus:border-accent outline-none text-slate-800 text-right"
                      placeholder="••••••••"
                    />
                  </div>
                </div>

                <div>
                  <button
                    type="submit"
                    class="w-full py-3.5 px-4 bg-accent hover:bg-opacity-95 text-white font-bold rounded-xl transition duration-200 shadow-lg shadow-accent/25"
                  >
                    دخول
                  </button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div class="min-h-screen flex flex-col bg-slate-50/50">
          {/* Toast Notification */}
          {toast.show && (
            <div class="fixed top-6 left-6 z-50 animate-bounce">
              <div class={`px-6 py-3.5 rounded-2xl text-white font-bold text-sm shadow-xl flex items-center gap-2 ${
                toast.type === "success" ? "bg-emerald-600 shadow-emerald-600/10" : 
                toast.type === "error" ? "bg-rose-600 shadow-rose-600/10" : "bg-blue-600 shadow-blue-600/10"
              }`}>
                <span>{toast.message}</span>
              </div>
            </div>
          )}

          {/* Header */}
          <header class="bg-white border-b border-slate-200/80 sticky top-0 z-40 shadow-sm/50">
            <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
              <div class="flex items-center gap-4">
                <img src="images/شعار.png" alt="Logo" class="h-10 w-auto" />
                <h1 class="text-xl font-black text-slate-900 border-r pr-4 border-slate-200">لوحة تحكم المنتجات</h1>
              </div>

              <div class="flex items-center gap-3.5 flex-wrap justify-center">
                {dbStatus === "firebase" ? (
                  <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-100">
                    <span class="h-2.5 w-2.5 rounded-full bg-emerald-500"></span>
                    متصل بـ Firebase
                  </span>
                ) : (
                  <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold bg-amber-50 text-amber-700 border border-amber-100">
                    <span class="h-2.5 w-2.5 rounded-full bg-amber-500 animate-pulse"></span>
                    وضع المحاكاة المحلي
                  </span>
                )}

                <a href="index.html" target="_blank" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition-all">
                  معاينة الموقع ↗
                </a>

                <button
                  onClick={handleLogout}
                  class="px-4 py-2 text-xs font-bold text-rose-600 bg-rose-50 hover:bg-rose-600 hover:text-white rounded-xl transition-all border border-rose-100"
                >
                  تسجيل الخروج
                </button>
              </div>
            </div>
          </header>

          {/* Main Area */}
          <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-8 flex-1 w-full">
            {/* Top Toolbar */}
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6 sm:mb-8 bg-white p-4 sm:p-6 rounded-3xl shadow-sm border border-slate-100">
              <div class="flex flex-1 flex-col sm:flex-row gap-3">
                {/* Search */}
                <div class="relative flex-1">
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="ابحث عن منتج بالاسم أو الوصف..."
                    class="w-full pr-10 pl-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 text-sm focus:bg-white focus:ring-2 focus:ring-accent outline-none transition-all text-right"
                  />
                  <div class="absolute right-3 top-3 text-slate-400">
                    <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                  </div>
                </div>
                {/* Category Filter */}
                <select
                  value={selectedCategoryFilter}
                  onChange={(e) => setSelectedCategoryFilter(e.target.value)}
                  class="px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-700 text-sm outline-none focus:ring-2 focus:ring-accent"
                >
                  <option value="all">كل الفئات</option>
                  {categories.map((c) => (
                    <option key={c.id} value={c.id}>{c.title}</option>
                  ))}
                </select>
              </div>

              <div>
                <button
                  onClick={openAddForm}
                  class="w-full md:w-auto px-5 py-3 bg-accent text-white font-bold rounded-xl shadow-lg shadow-accent/20 hover:bg-opacity-95 transition-all flex items-center justify-center gap-2"
                >
                  <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                  إضافة منتج جديد
                </button>
              </div>
            </div>

            {/* Products Grid */}
            {filteredProducts.length === 0 ? (
              <div class="bg-white rounded-3xl border border-slate-100 p-12 text-center shadow-sm">
                <svg class="mx-auto h-16 w-16 text-slate-300 mb-4" fill="none" stroke="currentColor" strokeWidth="1.5" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z" />
                </svg>
                <h3 class="text-lg font-bold text-slate-800 mb-1">لا توجد منتجات</h3>
                <p class="text-slate-500 text-sm">لم يتم العثور على أي منتج يطابق خيارات البحث الحالية.</p>
              </div>
            ) : (
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {filteredProducts.map((prod) => (
                  <div key={prod.id} class="bg-white rounded-3xl overflow-hidden border border-slate-100 shadow-sm hover:shadow-md transition-all flex flex-col">
                    <div class="relative h-48 bg-slate-100 flex items-center justify-center overflow-hidden">
                      <img src={prod.image} alt={prod.name} class="max-h-full max-w-full object-contain" />
                      <span class="absolute top-4 right-4 bg-slate-900/80 backdrop-blur-md text-white text-xs px-3 py-1 rounded-full font-semibold">
                        {categories.find(c => c.id === parseInt(prod.category))?.title || "غير محدد"}
                      </span>
                      {prod.available === false && (
                        <span class="absolute top-4 left-4 bg-rose-600 text-white text-xs px-3 py-1 rounded-full font-semibold">
                          غير متوفر
                        </span>
                      )}
                    </div>
                    <div class="p-6 flex-1 flex flex-col justify-between">
                      <div>
                        <h3 class="font-bold text-lg text-slate-900 mb-1">{prod.name}</h3>
                        <p class="text-sm text-slate-500 line-clamp-2 min-h-[40px] mb-4">
                          {prod.description || "لا يوجد وصف لهذا المنتج."}
                        </p>
                      </div>

                      <div class="flex justify-between items-center border-t border-slate-100 pt-4 mt-2">
                        <div>
                          <span class="text-xs text-slate-400 block">السعر</span>
                          <span class="text-base font-black text-accent">{prod.price}</span>
                        </div>
                        <div class="flex gap-2">
                          <button
                            onClick={() => openEditForm(prod)}
                            class="px-3.5 py-2 text-xs font-bold bg-slate-100 hover:bg-accent hover:text-white rounded-xl transition-all"
                          >
                            تعديل
                          </button>
                          <button
                            onClick={() => handleDeleteProduct(prod)}
                            class="px-3.5 py-2 text-xs font-bold bg-rose-50 hover:bg-rose-600 text-rose-600 hover:text-white rounded-xl transition-all"
                          >
                            حذف
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>

          {/* Form Modal / Drawer */}
          {isFormOpen && (
            <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden border border-slate-100 animate-in fade-in zoom-in duration-200 max-h-[90vh] flex flex-col">
                <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                  <h3 class="font-black text-lg text-slate-900">
                    {editingProduct ? "تعديل بيانات المنتج" : "إضافة منتج جديد"}
                  </h3>
                  <button
                    onClick={() => setIsFormOpen(false)}
                    class="text-slate-400 hover:text-slate-600 text-xl font-bold"
                  >
                    ✕
                  </button>
                </div>

                <form onSubmit={handleSaveProduct} class="p-4 sm:p-6 space-y-4 overflow-y-auto flex-1 text-right">
                  {/* Name */}
                  <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">اسم المنتج (بالعربية)</label>
                    <input
                      type="text"
                      required
                      value={formName}
                      onChange={(e) => setFormName(e.target.value)}
                      class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent outline-none text-slate-800 text-right"
                      placeholder="مثال: بوكيه التوليب الأبيض"
                    />
                  </div>

                  {/* Row: Price & Category */}
                  <div class="grid grid-cols-2 gap-4">
                    <div>
                      <label class="block text-sm font-bold text-slate-700 mb-1">السعر (صيغة عرض)</label>
                      <input
                        type="text"
                        required
                        value={formPrice}
                        onChange={(e) => setFormPrice(e.target.value)}
                        class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent outline-none text-slate-800 text-right"
                        placeholder="مثال: 250 ج.م"
                      />
                    </div>
                    <div>
                      <label class="block text-sm font-bold text-slate-700 mb-1">الفئة</label>
                      <select
                        value={formCategory}
                        onChange={(e) => setFormCategory(e.target.value)}
                        class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent outline-none text-slate-800"
                      >
                        {categories.map((c) => (
                          <option key={c.id} value={c.id}>{c.title}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  {/* Image URL, File Upload & Preview */}
                  <div>
                    <div class="flex items-center justify-between mb-1">
                      <label class="block text-sm font-bold text-slate-700">صورة المنتج الأساسية</label>
                      <label class="text-xs font-bold text-accent cursor-pointer hover:underline flex items-center gap-1">
                        <span>📂 رفع صورة جديدة من جهازك</span>
                        <input
                          type="file"
                          accept="image/*"
                          className="hidden"
                          onChange={(e) => {
                            const file = e.target.files[0];
                            if (file) {
                              const reader = new FileReader();
                              reader.onloadend = async () => {
                                const compressed = await compressImage(reader.result);
                                setFormImage(compressed);
                                showToast("تم رفع الصورة بنجاح!", "success");
                              };
                              reader.readAsDataURL(file);
                            }
                          }}
                        />
                      </label>
                    </div>
                    <div class="flex gap-3">
                      <input
                        type="text"
                        required
                        value={formImage}
                        onChange={(e) => setFormImage(e.target.value)}
                        class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent outline-none text-slate-800 text-left text-xs"
                        placeholder="رابط الصورة أو كود الصورة الثنائي"
                        dir="ltr"
                      />
                      <div class="w-12 h-12 rounded-xl bg-slate-100 border border-slate-200 overflow-hidden flex items-center justify-center flex-shrink-0">
                        <img src={formImage} alt="Preview" class="max-w-full max-h-full object-contain" onerror="this.src='images/22.png'" />
                      </div>
                    </div>
                    {/* Quick Selection Images */}
                    <div class="mt-2.5">
                      <span class="block text-xs text-slate-400 mb-1.5">اختيار سريع لصورة افتراضية:</span>
                      <div class="flex gap-2 overflow-x-auto pb-1.5 scrollbar-thin">
                        {imagePresets.map((img) => (
                          <button
                            key={img}
                            type="button"
                            onClick={() => setFormImage(img)}
                            class={`w-10 h-10 border rounded-lg overflow-hidden flex-shrink-0 flex items-center justify-center transition-all ${
                              formImage === img ? "border-accent ring-2 ring-rose-200" : "border-slate-200 hover:border-slate-300"
                            }`}
                          >
                            <img src={img} alt="preset" class="max-h-full max-w-full object-contain" />
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Secondary Images List */}
                    <div class="mt-4 border-t border-slate-100 pt-4">
                      <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-bold text-slate-700">صور إضافية للمنتج (معرض الصور)</span>
                        <label class="text-xs font-bold text-accent cursor-pointer hover:underline flex items-center gap-1">
                          <span>➕ إضافة صورة إضافية</span>
                          <input
                            type="file"
                            accept="image/*"
                            className="hidden"
                            onChange={(e) => {
                              const file = e.target.files[0];
                              if (file) {
                                const reader = new FileReader();
                                reader.onloadend = async () => {
                                  const compressed = await compressImage(reader.result);
                                  setFormImages(prev => [...prev, compressed]);
                                  showToast("تم إضافة صورة إضافية!", "success");
                                };
                                reader.readAsDataURL(file);
                              }
                            }}
                          />
                        </label>
                      </div>
                      {formImages.length === 0 ? (
                        <p class="text-xs text-slate-400">لا توجد صور إضافية لهذا المنتج.</p>
                      ) : (
                        <div class="flex gap-2.5 flex-wrap">
                          {formImages.map((img, i) => (
                            <div key={i} class="relative w-12 h-12 rounded-xl border border-slate-200 overflow-hidden group flex-shrink-0 flex items-center justify-center bg-slate-50">
                              <img src={img} class="max-h-full max-w-full object-contain" />
                              <button
                                type="button"
                                onClick={() => setFormImages(prev => prev.filter((_, idx) => idx !== i))}
                                class="absolute inset-0 bg-rose-600/90 text-white font-bold text-[10px] flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"
                              >
                                حذف
                              </button>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Description */}
                  <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">الوصف والتفاصيل</label>
                    <textarea
                      value={formDescription}
                      onChange={(e) => setFormDescription(e.target.value)}
                      rows="3"
                      class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-accent outline-none text-slate-800 text-right"
                      placeholder="اكتب تفاصيل ومواصفات المنتج هنا..."
                    ></textarea>
                  </div>

                  {/* Availability */}
                  <div class="flex items-center gap-2 pt-2">
                    <input
                      type="checkbox"
                      id="formAvailable"
                      checked={formAvailable}
                      onChange={(e) => setFormAvailable(e.target.checked)}
                      class="h-4.5 w-4.5 text-accent border-slate-300 rounded focus:ring-accent"
                    />
                    <label for="formAvailable" class="text-sm font-bold text-slate-700 select-none">
                      هذا المنتج متوفر في المعرض حالياً
                    </label>
                  </div>

                  {/* Action Buttons */}
                  <div class="flex justify-end gap-3 pt-4 border-t border-slate-100 mt-6">
                    <button
                      type="button"
                      onClick={() => setIsFormOpen(false)}
                      class="px-5 py-2.5 text-sm font-bold text-slate-500 hover:bg-slate-100 rounded-xl transition-all"
                    >
                      إلغاء
                    </button>
                    <button
                      type="submit"
                      class="px-5 py-2.5 text-sm font-bold bg-accent text-white rounded-xl hover:bg-opacity-95 shadow-md shadow-accent/10 transition-all"
                    >
                      {editingProduct ? "حفظ التغييرات" : "إضافة المنتج"}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    };

    const container = document.getElementById('admin-root');
    const root = ReactDOM.createRoot(container);
    root.render(<AdminApp />);
  </script>
</body>

</html>
