    nav {

      justify-content: center;

    /* Scroll reveal CSS keyframes */
    .reveal {

    /* ─── SCROLL TO TOP ─── */
    .scroll-to-top {

      background: rgba(255, 255, 255, 0.85);

      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 8px 30px rgba(244, 63, 94, 0.12);

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* ─── SCROLL REVEAL ─── */
    function useScrollReveal(ref, delay = 0) {
      useEffect(() => {
        const el = ref.current; if (!el) return;
        el.style.transitionDelay = `${delay}ms`;
        const obs = new IntersectionObserver(([e]) => {
          if (e.isIntersecting) { el.classList.add('visible'); obs.unobserve(el) }
        }, { threshold: .12 });
        obs.observe(el); return () => obs.disconnect();
      }, []);
    }
    const R = ({ children, d = 0, className = '' }) => {
      const r = useRef();
      useScrollReveal(r, d);
      return <div ref={r} className={`reveal ${className}`}>{children}</div>;
    };

    /* ─── SVGs ─── */
    const Svg = {
      home: <svg width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>,
      user: <svg width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>,
      briefcase: <svg width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>,
      mail: <svg width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2" /><path d="M22 7l-10 7L2 7" /></svg>
    };

    /* ─── NAVBAR ─── */
    const Navbar = () => {
      const [scrolled, setScrolled] = useState(false);
      const [isOpen, setIsOpen] = useState(false);
      const [activeId, setActiveId] = useState('about');

      useEffect(() => {
        const handleScroll = () => {
          setScrolled(window.scrollY > 30);

          const scrollPos = window.scrollY + window.innerHeight * 0.5;
          let currentId = 'about';
          const ids = ['home', 'about', 'projects', 'services', 'contact', 'testimonials'];
          for (let i = ids.length - 1; i >= 0; i--) {
            const section = document.getElementById(ids[i]);
            if (section && section.offsetTop <= scrollPos) {
              currentId = ids[i];
              break;
            }
          }
          setActiveId(currentId);
        };
        window.addEventListener('scroll', handleScroll);
        handleScroll();
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      useEffect(() => {
        if (isOpen) {
          document.body.style.overflow = 'hidden';
          document.body.classList.add('menu-open');
        } else {
          document.body.style.overflow = '';
          document.body.classList.remove('menu-open');
        }
      }, [isOpen]);

      return (
        <>
          <nav className={scrolled ? 'scrolled' : ''}>
            <div className="nav-pill" style={{ zIndex: 100 }}>

              {/* Logo */}
              <div className="logo" style={{ zIndex: 101, alignItems: 'center' }}>
                <img src="images/شعار.png" alt="Logo" className="nav-logo-img" style={{ height: '35px', width: 'auto' }} />
              </div>

              {/* Center links */}
              <div className="nav-links">
                {[
                  { label: 'الرئيسية', url: '#home', id: 'home' },
                  { label: 'المنتجات', url: 'products.html', id: 'products' },
                  { label: 'من نحن', url: 'about.html', id: 'about' },
                  { label: 'تواصل معنا', url: '#contact', id: 'contact' }
                ].map(l => (
                  <a key={l.id} href={l.url} className={activeId === l.id ? 'active-nav' : ''}>{l.label}</a>
                ))}
              </div>

              {/* CTA */}
              <div className="nav-cta" style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
                <a href="#services" className="btn-primary" style={{ textDecoration: 'none' }}>اختار البوكيه</a>
                <a href="#contact" className="btn-ghost" style={{ textDecoration: 'none', height: '42px', display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}>تواصل معنا</a>
              </div>

              {/* Mobile Toggle with 2-line transition animation */}
              <button
                className={`nav-toggle ${isOpen ? 'open' : ''}`}
                style={{
                  zIndex: 101,
                  width: '32px',
                  height: '32px',
                  position: 'relative'
                }}
                onClick={() => setIsOpen(!isOpen)}
              >
                <span style={{
                  width: '20px',
                  height: '2px',
                  background: 'currentColor',
                  position: 'absolute',
                  transition: 'transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), top 0.3s cubic-bezier(0.4, 0, 0.2, 1)',
                  top: isOpen ? '15px' : '11px',
                  transform: isOpen ? 'rotate(45deg)' : 'none'
                }} />
                <span style={{
                  width: '20px',
                  height: '2px',
                  background: 'currentColor',
                  position: 'absolute',
                  transition: 'transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), top 0.3s cubic-bezier(0.4, 0, 0.2, 1)',
                  top: isOpen ? '15px' : '19px',
                  transform: isOpen ? 'rotate(-45deg)' : 'none'
                }} />
              </button>

            </div>
          </nav>

          {/* Mobile Menu */}
          <div className={`mobile-menu ${isOpen ? 'open' : ''}`} style={{ background: 'rgba(255, 255, 255, 0.98)' }}>
            {[
              { label: 'الرئيسية', url: '#home', id: 'home' },
              { label: 'المنتجات', url: 'products.html', id: 'products' },
              { label: 'من نحن', url: 'about.html', id: 'about' },
              { label: 'تواصل معنا', url: '#contact', id: 'contact' }
            ].map(l => (
              <a key={l.id} href={l.url} className={`m-link ${activeId === l.id ? 'active-nav' : ''}`} onClick={() => setIsOpen(false)} style={{ color: '#0a0a0f' }}>{l.label}</a>
            ))}
            <div className="mobile-menu-cta" style={{ width: '100%', padding: '0 24px', display: 'flex', flexDirection: 'column', gap: '10px' }}>
              <a href="#services" className="btn-primary" style={{ textDecoration: 'none', width: '100%', justifyContent: 'center' }} onClick={() => setIsOpen(false)}>اختار البوكيه</a>
              <a href="#contact" className="btn-ghost" style={{ textDecoration: 'none', width: '100%', justifyContent: 'center', height: '42px', display: 'inline-flex', alignItems: 'center' }} onClick={() => setIsOpen(false)}>تواصل معنا</a>
            </div>
          </div>
        </>
      );
    };

    /* ─── ABOUT SECTION ─── */
    const AboutSection = () => {
      return (
        <section id="about" style={{ position: 'relative', overflow: 'hidden' }}>
          {/* Dot grid background */}
          <div className="about-grid-bg" style={{
            position: 'absolute',
            inset: 0,
            backgroundImage: 'radial-gradient(rgba(10, 10, 15, 0.12) 1.5px, transparent 1.5px)',
            backgroundSize: '32px 32px',
            zIndex: 0,
            opacity: 0.8,
            pointerEvents: 'none'
          }} />

          <div className="about-wrap">
            <R>
              <div style={{ display: 'flex', justifyContent: 'center', marginBottom: '20px' }}>
                <span style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', border: '1px solid rgba(0, 0, 0, 0.12)', borderRadius: '100px', padding: '6px 16px', fontSize: '13px', fontWeight: '500', color: '#0a0a0f', background: 'transparent' }}>
                  من أنا
                </span>
              </div>
            </R>
            <R d={50}>
              <h2 className="section-h2" style={{ fontSize: 'clamp(28px, 4vw, 46px)', fontWeight: '800', marginTop: '0', marginBottom: '16px', color: '#0a0a0f', letterSpacing: '-0.02em', textAlign: 'center' }}>شغف يروي تفاصيل مشاعركم</h2>
            </R>
            <R d={75}>
              <p style={{ fontSize: '16px', color: '#4b5563', marginBottom: '48px', fontWeight: '500', letterSpacing: '-0.01em', textAlign: 'center' }}>نصنع من الستان تحفاً فنية تنبض بالجمال وتدوم للأبد</p>
            </R>
            <R d={100}>
              <div className="about-paragraph-container">
                "في <span style={{ color: '#e11d48', fontWeight: '800' }}>ماريستا</span>، نؤمن أن الورد ليس مجرد هدية عابرة، بل هو رسالة حب مغلفة بالأناقة. نتخصص في ابتكار وتصميم بوكيهات ورد الستان المصنوعة يدوياً بكل دقة لتظل ذكرى خالدة لا تذبل، إلى جانب تشكيلة مميزة من الهدايا الاستثنائية المنسقة خصيصاً لتناسب لحظاتكم السعيدة وتضفي عليها لمسة لا تُنسى."
              </div>
            </R>
          </div>
        </section>
      );
    };

    /* ─── GALLERY (معرض الأعمال) ─── */
    const GallerySection = () => {
      const [galleryItems, setGalleryItems] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [visibleCount, setVisibleCount] = useState(12);

      useEffect(() => {
        const unsubscribe = window.AppDB.getGalleryItems((data) => {
          setGalleryItems(data);
          setIsLoading(false);
        });
        return () => unsubscribe();
      }, []);

      const displayedItems = galleryItems.slice(0, visibleCount);

      return (
        <section id="projects" style={{ position: 'relative', overflow: 'hidden', padding: '80px 24px' }}>
          {/* Dot grid points background */}
          <div className="projects-grid-bg" style={{
            position: 'absolute',
            inset: 0,
            backgroundImage: 'radial-gradient(rgba(10, 10, 15, 0.12) 1.5px, transparent 1.5px)',
            backgroundSize: '32px 32px',
            opacity: 0.8,
            zIndex: 0,
            pointerEvents: 'none'
          }} />

          <div className="projects-inner" style={{ position: 'relative', zIndex: 1, padding: 0, maxWidth: '1104px', margin: '0 auto' }}>
            <R>
              <div style={{ display: 'flex', justifyContent: 'center', marginBottom: '20px' }}>
                <span style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', border: '1px solid rgba(0, 0, 0, 0.12)', borderRadius: '100px', padding: '6px 16px', fontSize: '13px', fontWeight: '500', color: '#0a0a0f', background: 'transparent' }}>
                  معرض الأعمال
                </span>
              </div>
            </R>
            <R d={50}>
              <h2 className="section-h2" style={{ fontSize: 'clamp(24px, 3vw, 36px)', fontWeight: '700', marginTop: '0', marginBottom: '12px', color: '#0a0a0f', letterSpacing: '-0.02em', textAlign: 'center' }}>مقتطفات من أعمالنا السابقة</h2>
            </R>
            <R d={75}>
              <p style={{ fontSize: '14px', color: '#4b5563', marginBottom: '48px', fontWeight: '500', letterSpacing: '-0.01em', textAlign: 'center' }}>تصفح مجموعة من التنسيقات والبوكيهات الفاخرة التي تم تجهيزها لعملائنا.</p>
            </R>

            {/* Gallery Grid */}
            <R d={100}>
              {isLoading ? (
                <div className="text-center py-12 text-slate-400">جاري التحميل...</div>
              ) : galleryItems.length === 0 ? (
                <div className="text-center py-12 text-slate-400">لا توجد صور في معرض الأعمال حالياً.</div>
              ) : (
                <>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                    {displayedItems.map((item, index) => (
                      <div key={item.id || index} className="group relative overflow-hidden rounded-2xl bg-white border border-black/5 shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-md">
                        <div className="aspect-[4/5] w-full overflow-hidden bg-gray-100">
                          <img
                            src={item.src}
                            alt={item.title}
                            className="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
                          />
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* Show More Button */}
                  {galleryItems.length > visibleCount && (
                    <div style={{ display: 'flex', justifyContent: 'center', marginTop: '40px' }}>
                      <button
                        onClick={() => setVisibleCount(prev => prev + 12)}
                        className="btn-ghost"
                        style={{ height: '42px', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontWeight: '700', textDecoration: 'none' }}
                      >
                        عرض المزيد
                      </button>
                    </div>
                  )}
                </>
              )}
            </R>
          </div>
        </section>
      );
    };

    /* ─── TESTIMONIALS ─── */
    const Testimonials = () => {
      const reviews = [
        "حرفياً أشطر واحدة تعمل بوكيهات فى الدنيا كفاية ذوقك والله وطريقتك فى التعامل وصاحبتي فرحت بيه اوي اوي ومفيش حد شافه ومعلقش عليه والله مبسوطة اوي اني اتعرفت على حد زيك وان شاء الله مش اخر تعامل بينا ❤️❤️❤️❤️❤️❤️❤️",
        "البوكيه طلع يجنن بجد والتفاصيل والورد الستان شكله طبيعي جداً وراقي والتقفيل نضيف وممتاز تسلم ايدك وإن شاء الله هطلب منك علطول ❤️❤️❤️❤️❤️",
        "بجد ذوقك يجنن والتعامل راقي جداً، البوكيه كان مفاجأة حلوة أوي لصحبتي وعجب كل الناس في الحفلة. شكراً ليكي ولسرعة التوصيل والخدمة الممتازة ❤️❤️❤️❤️❤️❤️❤️",
        "شغل احترافي ومتقن جداً، الورد الستان لونه تحفة وحجم البوكيه مناسب جداً. بجد فخورة إن عندنا حد بيعمل الجمال ده بالدقة دي ❤️❤️❤️❤️❤️",
        "حرفياً البوكيه تحفة فنية وكل اللي شافوه سألوني عليه، الذوق والتعامل والتغليف بجد فوق الممتاز. مش هيكون آخر تعامل أكيد ❤️❤️❤️❤️❤️❤️❤️"
      ];

      // Double the list for infinite scrolling effect
      const doubledReviews = [...reviews, ...reviews];

      return (
        <section id="testimonials" style={{ position: 'relative', overflow: 'hidden', padding: '100px 24px 80px' }}>
          {/* Dot grid points background */}
          <div className="booking-grid-bg" style={{
            position: 'absolute',
            inset: 0,
            backgroundImage: 'radial-gradient(rgba(10, 10, 15, 0.12) 1.5px, transparent 1.5px)',
            backgroundSize: '32px 32px',
            opacity: 0.8,
            zIndex: 0,
            pointerEvents: 'none'
          }} />

          <div className="schedule-wrap projects-inner" style={{ position: 'relative', zIndex: 1, padding: 0, maxWidth: '100%', overflow: 'hidden' }}>
            <R>
              <div style={{ display: 'flex', justifyContent: 'center', marginBottom: '20px' }}>
                <span style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', border: '1px solid rgba(0, 0, 0, 0.12)', borderRadius: '100px', padding: '6px 16px', fontSize: '13px', fontWeight: '500', color: '#0a0a0f', background: 'transparent' }}>
                  آراء عملائنا
                </span>
              </div>
            </R>
            <R d={50}>
              <h2 className="section-h2" style={{ fontSize: 'clamp(24px, 3vw, 36px)', fontWeight: '700', marginTop: '0', marginBottom: '12px', color: '#0a0a0f', letterSpacing: '-0.02em', textAlign: 'center' }}>قالوا عن ماريستا</h2>
            </R>
            <R d={75}>
              <p style={{ fontSize: '14px', color: '#4b5563', marginBottom: '48px', fontWeight: '500', letterSpacing: '-0.01em', textAlign: 'center' }}>شغفنا ينعكس في رضا وسعادة عملائنا بمشاركتهم أجمل لحظاتهم.</p>
            </R>

            {/* Testimonials Horizontal Scroll Track */}
            <div className="testimonials-marquee" style={{ width: '100%', overflow: 'hidden', position: 'relative', padding: '20px 0' }}>
              <style dangerouslySetInnerHTML={{
                __html: `
                .testimonials-track {
                  display: flex;
                  gap: 24px;
                  width: max-content;
                  animation: marquee-scroll 35s linear infinite;
                }
                .testimonials-track:hover {
                  animation-play-state: paused;
                }
                .testimonial-card {
                  background: linear-gradient(135deg, #fff5f6 0%, #ffffff 100%);
                  border: 1px solid rgba(244, 63, 94, 0.15);
                  border-radius: 32px;
                  padding: 44px 32px 32px;
                  width: 380px;
                  max-width: 90vw;
                  white-space: normal;
                  display: flex;
                  flex-direction: column;
                  justify-content: space-between;
                  box-shadow: 0 10px 30px rgba(244, 63, 94, 0.03);
                  direction: rtl;
                  position: relative;
                  margin-top: 28px;
                }
                .testimonial-logo {
                  position: absolute;
                  top: -28px;
                  right: 32px;
                  width: 56px;
                  height: 56px;
                  border-radius: 50%;
                  border: 3px solid #ffffff;
                  box-shadow: 0 4px 12px rgba(244, 63, 94, 0.15);
                  background: #ffffff;
                  object-fit: cover;
                }
                .testimonial-text {
                  font-size: 14.5px;
                  color: #374151;
                  line-height: 1.8;
                  font-weight: 500;
                  text-align: right;
                  margin-bottom: 16px;
                }
                .testimonial-hearts {
                  display: flex;
                  justify-content: center;
                  font-size: 18px;
                  color: #e11d48;
                }
                @keyframes marquee-scroll {
                  0% {
                    transform: translate3d(0, 0, 0);
                  }
                  100% {
                    transform: translate3d(calc(-50% - 12px), 0, 0);
                  }
                }
              `}} />
              <div className="testimonials-track" style={{ direction: 'ltr' }}>
                {doubledReviews.map((text, idx) => (
                  <div key={idx} className="testimonial-card">
                    <img src="images/cropped_circle_image.png" className="testimonial-logo" alt="Logo" />
                    <p className="testimonial-text">{text.replace(/❤️+/g, '')}</p>
                    <div className="testimonial-hearts">
                      {"❤️".repeat(7)}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </section>
      );
    };

    /* ─── SCROLL TO TOP ─── */
    const ScrollToTop = () => {
      const [visible, setVisible] = useState(false);

      useEffect(() => {
        const toggleVisibility = () => {
          if (window.scrollY > 400) {
            setVisible(true);
          } else {
            setVisible(false);
          }
        };
        window.addEventListener('scroll', toggleVisibility);
        return () => window.removeEventListener('scroll', toggleVisibility);
      }, []);

      const scrollToTop = () => {
        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
      };

      return (
        <button
          onClick={scrollToTop}
          className={`scroll-to-top ${visible ? 'visible' : ''}`}
          aria-label="Back to top"
        >
          <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
            <polyline points="18 15 12 9 6 15" />
          </svg>
        </button>
      );
    };

    /* ─── FOOTER ─── */
    const Footer = () => (
      <footer style={{ background: 'transparent', padding: '60px 24px 40px', borderTop: '1px solid rgba(0, 0, 0, 0.05)', textAlign: 'center', position: 'relative', overflow: 'hidden' }}>
        <div className="footer-grid-bg" style={{ position: 'absolute', inset: 0, backgroundImage: 'radial-gradient(rgba(10, 10, 15, 0.12) 1.5px, transparent 1.5px)', backgroundSize: '32px 32px', opacity: 0.8, zIndex: 0, pointerEvents: 'none' }} />

        <div className="footer-links">
          <a href="index.html#home">الرئيسية</a>
          <a href="about.html" className="active-nav">من أنا</a>
          <a href="about.html#projects">آلية العمل</a>
          <a href="index.html#services">الخدمات</a>
          <a href="index.html#contact">اتصل بنا</a>
          <a href="index.html#testimonials">آراء عملائنا</a>
        </div>

        <div style={{ position: 'relative', marginBottom: '24px', zIndex: 1, fontFamily: '"Thmanyah Serif Text", "Thmanyah Serif Display", Georgia, serif', fontWeight: '900', fontSize: 'clamp(60px, 12vw, 150px)', color: '#000000', whiteSpace: 'nowrap', userSelect: 'none', lineHeight: '1' }}>
          مــاريــستا
        </div>
        <p style={{ fontSize: '13px', color: '#6b7280', margin: '0', position: 'relative', zIndex: 1, fontWeight: '500' }}>
          © ٢٠٢٦ ماريستا. جميع الحقوق محفوظة.
        </p>
      </footer>
    );

    /* ─── BOTTOM NAV ─── */
    const BottomNav = () => {
      const navItems = [
        { id: 'home', label: 'الرئيسية', icon: Svg.home, url: 'index.html#home' },
        { id: 'about', label: 'من أنا', icon: Svg.user, url: 'about.html' },
        { id: 'projects', label: 'آلية العمل', icon: Svg.briefcase, url: 'about.html#projects' },
        { id: 'contact', label: 'اتصل بنا', icon: Svg.mail, url: 'index.html#contact' }
      ];

      return (
        <div className="bottom-nav">
          <div className="bottom-nav-inner">
            {navItems.map(item => (
              <a key={item.id} href={item.url} className={`b-nav-item ${item.id === 'about' ? 'active' : ''}`}>
                <div className="b-nav-icon">{item.icon}</div>
                <span>{item.label}</span>
              </a>
            ))}
          </div>
        </div>
      );
    };

    /* ─── APP ─── */
    const App = () => {
      return (
        <div>
          <ScrollToTop />
          <Navbar />
          <AboutSection />
          <GallerySection />
          <Testimonials />
          <Footer />
          <BottomNav />
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
